version: 2

# Dependabot needs static credentials for private registries (no OIDC).
# Use a Chainguard pull token ID + token value pair as Dependabot secrets
# (Settings -> Secrets and variables -> Dependabot).
#
# Generate with:
#   chainctl auth pull-token --library-name=trineta.net --ttl=8760h
registries:
  cgr-trineta:
    type: docker-registry
    url: https://cgr.dev
    username: ${{ secrets.CHAINGUARD_PULL_TOKEN_ID }}
    password: ${{ secrets.CHAINGUARD_PULL_TOKEN_PASSWORD }}

updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "00:00"
      timezone: Etc/UTC
    registries:
      - cgr-trineta
    labels:
      - automated pr
      - kind/cleanup
      - release-note-none
    commit-message:
      prefix: chore
      include: scope
    pull-request-branch-name:
      # Use a deterministic branch namespace for Dependabot PRs.
      # Dependabot still appends ecosystem/dependency segments to keep refs unique.
      prefix: dependabot/update-digests
      separator: /
    open-pull-requests-limit: 5
